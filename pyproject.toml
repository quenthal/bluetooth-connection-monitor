# Development tooling only; the integration itself is not a Python package.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = [
    "E501",    # line length is left to the formatter
    "PLR2004", # magic values in tests
    "PLR0913", # Home Assistant callbacks take many arguments
    "BLE001",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.bluetooth_connection_monitor"]
force-sort-within-sections = true
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant"]
